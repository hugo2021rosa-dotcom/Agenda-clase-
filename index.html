<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de clase</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5ff5">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#14213d;--mute:#5b6b7f;--line:#cdd7e0;--exam:#d1495b;--work:#1b8a8f;--btn:#14213d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#18232f;--ink:#e8eef4;--mute:#92a3b6;--line:#2a3a4a;--exam:#f0707f;--work:#4cc3c8;--btn:#e8eef4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;font-weight:800;margin:8px 0 16px;letter-spacing:-.02em}
nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px 4px!important;font-size:.9rem!important;padding:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 1rem inherit;font-family:inherit;border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{background:var(--btn);color:var(--bg)}
input,select,button{font-family:inherit;font-size:1rem}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.search{margin-bottom:12px}
form{display:grid;gap:8px;background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--line);margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{padding:11px;border:0;border-radius:8px;background:var(--btn);color:var(--bg);font-weight:600;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--exam);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center}
li.trabajo{border-left-color:var(--work)}
li.pasado{opacity:.5}
.info{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--mute);font-size:.9rem}
.tag{font-weight:600}
.exam .tag,li:not(.trabajo) .tag{color:var(--exam)}
li.trabajo .tag{color:var(--work)}
a{color:var(--work)}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.vacio,.aviso{color:var(--mute);text-align:center;padding:20px}
.aviso{background:var(--card);border:1px dashed var(--exam);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,420px)}
dialog form{border:0;padding:0;margin:0}
:focus-visible{outline:3px solid var(--work);outline-offset:2px}
h2.dia{font-size:1.05rem;margin:18px 0 8px}
h2.dia.hoy{color:var(--work)}
.hora{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;margin-bottom:8px;border:0;border-radius:10px;color:#fff;cursor:pointer;font-family:inherit;font-size:1rem}
.hora small{display:block;opacity:.9}
.hora b{white-space:nowrap}
.hora.e0{background:#2e9e5b}.hora.e1{background:#e08a1e}.hora.e2{background:#d1495b}
.hora .est{font-size:.8rem;font-weight:600;white-space:nowrap}
.leyenda{color:var(--mute);font-size:.9rem;margin:0 0 4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Agenda de clase</h1>
  <div id="aviso" class="aviso" hidden>Falta configurar Firebase. Edita <b>firebase-config.js</b> (mira el README).</div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="fechas">Exámenes y trabajos</button>
    <button role="tab" aria-selected="false" data-tab="horario">Horario</button>
    <button role="tab" aria-selected="false" data-tab="deberes">Deberes</button>
    <button role="tab" aria-selected="false" data-tab="libros">Libros</button>
  </nav>

  <section id="fechas">
    <input class="search" id="q-fechas" type="search" placeholder="Buscar materia…">
    <form id="f-fechas">
      <input name="titulo" placeholder="Título de la materia" required>
      <div class="row">
        <select name="tipo"><option value="examen">Examen</option><option value="trabajo">Trabajo</option></select>
        <input name="fecha" type="date" required>
      </div>
      <button class="primary">Añadir</button>
    </form>
    <ul id="l-fechas"></ul>
  </section>

  <section id="horario" hidden>
    <p class="leyenda">Toca una hora: 🟢 hay clase → 🟠 examen → 🔴 no hay clase → 🟢. Se reinicia cada semana.</p>
    <div id="semana" class="leyenda"></div>
    <div id="l-horario"></div>
  </section>

  <section id="deberes" hidden>
    <input class="search" id="q-deberes" type="search" placeholder="Buscar asignatura o tema…">
    <form id="f-deberes">
      <select name="asignatura" required><option>CEAC</option><option>OACV</option><option>ING</option><option>EYA</option><option>TII</option><option>TC</option><option>IPE I GM</option><option>SASPM</option><option>DASPGM</option></select>
      <input name="tema" placeholder="Tema" required>
      <div class="row">
        <input name="ejercicios" placeholder="Ejercicios (ej. 1, 2, 5)" required>
        <input name="pagina" placeholder="Página" required>
      </div>
      <label class="m">Fecha en que se mandó</label>
      <input name="fecha" type="date" required>
      <button class="primary">Añadir deberes</button>
    </form>
    <ul id="l-deberes"></ul>
  </section>

  <section id="libros" hidden>
    <input class="search" id="q-libros" type="search" placeholder="Buscar libro…">
    <form id="f-libros">
      <input name="titulo" placeholder="Título del libro" required>
      <input name="url" type="url" placeholder="Enlace al libro digital (https://…)" required>
      <button class="primary">Añadir libro</button>
    </form>
    <ul id="l-libros"></ul>
  </section>
</main>

<dialog id="dlg">
  <form id="f-edit" method="dialog">
    <input name="titulo" required>
    <select name="tipo"><option value="examen">Examen</option><option value="trabajo">Trabajo</option></select>
    <input name="fecha" type="date">
    <select name="asignatura"><option>CEAC</option><option>OACV</option><option>ING</option><option>EYA</option><option>TII</option><option>TC</option><option>IPE I GM</option><option>SASPM</option><option>DASPGM</option></select>
    <input name="tema" placeholder="Tema">
    <input name="ejercicios" placeholder="Ejercicios">
    <input name="pagina" placeholder="Página">
    <input name="url" type="url">
    <div class="row"><button class="primary" value="ok">Guardar</button><button class="primary" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, setDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (firebaseConfig.apiKey === "PEGA_AQUI") { $("#aviso").hidden = false; throw new Error("Firebase sin configurar"); }

const db = getFirestore(initializeApp(firebaseConfig));
const data = { fechas: [], libros: [] };

// Pestañas
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  for (const t of ["fechas", "horario", "deberes", "libros"]) $("#" + t).hidden = b.dataset.tab !== t;
});

// Sincronización en tiempo real
for (const col of ["fechas", "deberes", "libros"]) {
  onSnapshot(collection(db, col), snap => {
    data[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(col);
  });
  $("#q-" + col).oninput = () => render(col);
  $("#f-" + col).onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    await addDoc(collection(db, col), { ...f, creado: serverTimestamp() });
    e.target.reset();
  };
}

function render(col) {
  const q = $("#q-" + col).value.trim().toLowerCase();
  let items = data[col].filter(i => nombre(col, i).toLowerCase().includes(q));
  if (col === "fechas") items.sort((a, b) => a.fecha.localeCompare(b.fecha));
  else if (col === "deberes") items.sort((a, b) => b.fecha.localeCompare(a.fecha));
  else items.sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));
  const hoy = new Date().toISOString().slice(0, 10);
  $("#l-" + col).innerHTML = items.length ? items.map(i => col === "fechas" ? fila(i, hoy) : col === "deberes" ? deber(i, hoy) : libro(i)).join("")
    : `<li class="vacio" style="display:block;border-left-width:1px">${q ? "Sin resultados" : "Aún no hay nada. Añade el primero."}</li>`;
}

function fila(i, hoy) {
  const d = Math.round((new Date(i.fecha) - new Date(hoy)) / 864e5);
  const cuando = d < 0 ? "pasado" : d === 0 ? "hoy" : d === 1 ? "mañana" : `en ${d} días`;
  const fecha = new Date(i.fecha + "T00:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
  return `<li class="${i.tipo} ${d < 0 ? "pasado" : ""}"><div class="info"><div class="t">${esc(i.titulo)}</div>
    <div class="m"><span class="tag">${i.tipo === "examen" ? "Examen" : "Trabajo"}</span> · ${fecha} · ${cuando}</div></div>${acciones("fechas", i.id)}</li>`;
}

const nombre = (col, i) => col === "deberes" ? `${i.asignatura} ${i.tema}` : i.titulo;

function deber(i, hoy) {
  const d = Math.round((new Date(hoy) - new Date(i.fecha)) / 864e5);
  const cuando = d <= 0 ? "hoy" : d === 1 ? "ayer" : `hace ${d} días`;
  const fecha = new Date(i.fecha + "T00:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "long" });
  return `<li class="trabajo"><div class="info"><div class="t">${esc(i.asignatura)} · ${esc(i.tema)}</div>
    <div class="m">Ejercicios: ${esc(i.ejercicios)} · Pág. ${esc(i.pagina)}</div>
    <div class="m"><span class="tag">Mandado</span> · ${fecha} · ${cuando}</div></div>${acciones("deberes", i.id)}</li>`;
}

function libro(i) {
  return `<li class="trabajo"><div class="info"><div class="t">${esc(i.titulo)}</div>
    <div class="m"><a href="${esc(i.url)}" target="_blank" rel="noopener">Abrir libro</a></div></div>${acciones("libros", i.id)}</li>`;
}

const acciones = (col, id) => `<div class="acts"><button data-a="edit" data-c="${col}" data-id="${id}">Editar</button><button data-a="del" data-c="${col}" data-id="${id}">Eliminar</button></div>`;

// ---- Horario semanal (se reinicia cada semana) ----
const HORAS = ["15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00", "18:15 - 19:15", "19:15 - 20:15", "20:15 - 21:15"];
const HORARIO = [
  ["Lunes",     [["CEAC","Gema Milla Martos"],["CEAC","Gema Milla Martos"],["OACV","Gema Milla Martos"],["ING","Mariano Suárez Rodriguez"],["EYA","Joana Belmonte Jaén"],["TII","Joana Belmonte Jaén"]]],
  ["Martes",    [["TII","Joana Belmonte Jaén"],["IPE I GM","FOL"],["IPE I GM","FOL"],["EYA","Joana Belmonte Jaén"],["SASPM","FOL"],["DASPGM","FOL"]]],
  ["Miércoles", [["ING","Mariano Suárez Rodriguez"],["ING","Mariano Suárez Rodriguez"],["TC","Margarita Maya Barbecho"],["IPE I GM","FOL"],["TII","Joana Belmonte Jaén"],["TII","Joana Belmonte Jaén"]]],
  ["Jueves",    [["EYA","Joana Belmonte Jaén"],["CEAC","Gema Milla Martos"],["CEAC","Gema Milla Martos"],["OACV","Gema Milla Martos"],["OACV","Gema Milla Martos"],["TII","Joana Belmonte Jaén"]]],
  ["Viernes",   [["TII","Joana Belmonte Jaén"],["TII","Joana Belmonte Jaén"],["ING","Mariano Suárez Rodriguez"],["ING","Mariano Suárez Rodriguez"],["TC","Margarita Maya Barbecho"],["TC","Margarita Maya Barbecho"]]]
];
const ESTADOS = ["Clase", "Examen", "Sin clase"];

function lunesDeEstaSemana() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
let semana = lunesDeEstaSemana();
const lsKey = () => "horario-" + semana;
let estados = {};
try { estados = JSON.parse(localStorage.getItem(lsKey()) || "{}"); } catch {}

function renderHorario() {
  const hoyIdx = (new Date().getDay() + 6) % 7;
  $("#semana").textContent = "Semana del " + new Date(semana + "T00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long" });
  $("#l-horario").innerHTML = HORARIO.map(([dia, clases], di) =>
    `<h2 class="dia ${di === hoyIdx ? "hoy" : ""}">${dia}${di === hoyIdx ? " (hoy)" : ""}</h2>` +
    clases.map(([mat, prof], hi) => {
      const id = di + "-" + hi, e = estados[id] || 0;
      return `<button class="hora e${e}" data-h="${id}"><span><b>${HORAS[hi]}</b><br>${esc(mat)}<small>${esc(prof)}</small></span><span class="est">${ESTADOS[e]}</span></button>`;
    }).join("")).join("");
}

$("#l-horario").onclick = async ev => {
  const b = ev.target.closest("[data-h]"); if (!b) return;
  const id = b.dataset.h;
  estados[id] = ((estados[id] || 0) + 1) % 3;
  renderHorario();
  try { localStorage.setItem(lsKey(), JSON.stringify(estados)); } catch {}
  try { await setDoc(doc(db, "horario", semana), { s: { [id]: estados[id] } }, { merge: true }); } catch (err) { console.warn(err); }
};

function escucharSemana() {
  onSnapshot(doc(db, "horario", semana), snap => {
    if (semana !== lunesDeEstaSemana()) return;
    estados = (snap.exists() && snap.data().s) || {};
    try { localStorage.setItem(lsKey(), JSON.stringify(estados)); } catch {}
    renderHorario();
  }, err => console.warn(err));
}
escucharSemana();
renderHorario();
// Si la app queda abierta de una semana a otra, se reinicia sola
setInterval(() => {
  if (semana !== lunesDeEstaSemana()) { semana = lunesDeEstaSemana(); estados = {}; escucharSemana(); renderHorario(); }
}, 60000);

// Editar / eliminar
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const { a, c, id } = b.dataset;
  const item = data[c].find(x => x.id === id);
  if (a === "del") {
    if (confirm(`¿Eliminar "${nombre(c, item)}"?`)) await deleteDoc(doc(db, c, id));
    return;
  }
  const f = $("#f-edit");
  const esDeb = c === "deberes", esFecha = c === "fechas", esLib = c === "libros";
  f.titulo.hidden = esDeb; f.titulo.required = !esDeb;
  f.tipo.hidden = !esFecha;
  f.fecha.hidden = esLib; f.fecha.required = !esLib;
  f.url.hidden = !esLib; f.url.required = esLib;
  f.asignatura.hidden = f.tema.hidden = f.ejercicios.hidden = f.pagina.hidden = !esDeb;
  f.tema.required = f.ejercicios.required = f.pagina.required = esDeb;
  if (esDeb) {
    f.asignatura.value = item.asignatura; f.tema.value = item.tema;
    f.ejercicios.value = item.ejercicios; f.pagina.value = item.pagina; f.fecha.value = item.fecha;
  } else {
    f.titulo.value = item.titulo;
    if (esFecha) { f.tipo.value = item.tipo; f.fecha.value = item.fecha; } else f.url.value = item.url;
  }
  $("#dlg").returnValue = "";
  $("#dlg").showModal();
  $("#dlg").onclose = async () => {
    if ($("#dlg").returnValue !== "ok") return;
    let n;
    if (esDeb) n = { asignatura: f.asignatura.value, tema: f.tema.value, ejercicios: f.ejercicios.value, pagina: f.pagina.value, fecha: f.fecha.value };
    else if (esFecha) n = { titulo: f.titulo.value, tipo: f.tipo.value, fecha: f.fecha.value };
    else n = { titulo: f.titulo.value, url: f.url.value };
    await updateDoc(doc(db, c, id), n);
  };
});
</script>
</body>
</html>
